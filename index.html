<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PHYB57 中文学习资料库：按主题分类的课程专题与可编辑 Notebook。">
  <title>PHYB57 Study Library｜专题目录</title>
  <style>
    :root{color-scheme:dark;--bg:#0a121d;--surface:#12202e;--surface2:#182b3b;--line:#2e4555;--text:#eef6fa;--muted:#b4c5ce;--cyan:#67d6e8;--coral:#ff9a7e;--focus:#ffe69a}
    *{box-sizing:border-box}
    html{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
    body{margin:0;min-width:320px;background:radial-gradient(850px 490px at 82% -10%,#1b3b51,transparent 70%),var(--bg);color:var(--text);line-height:1.55}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
    .wrap{width:min(1100px,calc(100% - 40px));margin:auto}
    header{padding:42px 0 68px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.18em}
    .brand-mark{display:inline-grid;place-items:center;width:29px;height:29px;border:2px solid currentColor;border-radius:7px;font-size:18px;line-height:1}
    .eyebrow{margin:62px 0 10px;color:var(--coral);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    h1{font-size:clamp(43px,7vw,80px);line-height:1;letter-spacing:-.065em;margin:0}
    .lede{max-width:690px;color:#d3e2e9;font-size:clamp(16px,2vw,20px);margin:22px 0 0}
    main{padding:46px 0 70px}
    .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:0 0 23px}
    h2{font-size:25px;letter-spacing:-.035em;margin:0}
    .count{font-size:13px;color:var(--muted)}
    .group-label{font-size:12px;color:var(--cyan);font-weight:800;letter-spacing:.15em;margin:0 0 13px;text-transform:uppercase}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .card{display:block;background:linear-gradient(145deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:17px;padding:23px 25px 24px;min-height:204px;transition:border-color .18s,transform .18s}
    .card:hover{border-color:var(--cyan);transform:translateY(-3px)}
    .tag{color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .card h3{font-size:25px;letter-spacing:-.04em;margin:13px 0 8px;line-height:1.2}
    .card p{font-size:14px;color:var(--muted);margin:0;max-width:410px}
    .open{display:inline-block;margin-top:18px;color:var(--cyan);font-size:13px;font-weight:800}
    .open::after{content:" →"}
    .note{margin-top:44px;padding:16px 20px;border-left:3px solid var(--cyan);background:rgba(103,214,232,.08);font-size:13px;color:#c9dbe3}
    footer{border-top:1px solid var(--line);padding:24px 0 38px;color:#91a9b6;font-size:12px}
    @media(max-width:680px){.wrap{width:min(100% - 28px,610px)}header{padding:27px 0 49px}.eyebrow{margin-top:45px}.section-head{display:block}.count{display:block;margin-top:4px}.cards{grid-template-columns:1fr}.card{min-height:auto}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body>
  <header><div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span><span>PHYB57 STUDY LIBRARY</span></div>
    <p class="eyebrow">中文课程资料 · 按主题分类</p>
    <h1>PHYB57 专题库</h1>
    <p class="lede">每份资料独立归档：打开网页阅读，或下载 Notebook 继续编辑和运行。</p>
  </div></header>
  <main class="wrap">
    <div class="section-head"><h2>专题目录</h2><span class="count">1 个专题 · 持续增加</span></div>
    <section aria-labelledby="group-algorithms">
      <p class="group-label" id="group-algorithms">01 / 算法与复杂度</p>
      <div class="cards"><a class="card" href="./topics/algorithm-complexity-big-o/index.html"><span class="tag">Tutorial 4 · Big-O</span><h3>算法复杂度，逐行读懂</h3><p>从 O(1) 到 O(n²)，结合代码逐行讲解、操作计数、实测曲线与自测题答案。</p><span class="open">打开专题</span></a></div>
    </section>
    <p class="note">计时输出来自 Notebook 已保存的运行结果，具体数值随计算机环境变化；复杂度结论请结合代码分析。</p>
  </main>
  <footer><div class="wrap">PHYB57 Study Library · 依知识主题归档，方便后续加入独立专题。</div></footer>
</body>
</html>
